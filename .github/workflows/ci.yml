name: Node.js CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Iniciar servico MongoDB (Replica Set para Prisma)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongodb mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          for i in $(seq 1 30); do
            PRIMARY=$(docker exec mongodb mongosh --quiet --eval "rs.isMaster().ismaster")
            [ "$PRIMARY" = "true" ] && break
            sleep 1
          done

      - name: Configurar versao do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Executar Lint
        run: npm run lint

      - name: Executar Build
        run: npm run build

      - name: Executar testes automatizados
        run: npm test
        env:
          DATABASE_URL: mongodb://127.0.0.1:27017/gp_financas_test?replicaSet=rs0&directConnection=true
          JWT_SECRET: ci-test-jwt-secret-key

      - name: Validar build da imagem Docker
        run: docker build -t gp-financas-backend .